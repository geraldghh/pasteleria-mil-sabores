<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-layout">
    <aside class="sidebar">
        <div class="brand"><h2>¡HOLA Administrador!</h2></div>
        <nav class="menu-vertical">
            <ul>
                <li><a href="admin_home.html">🏠 Dashboard</a></li>
                <li><a href="admin_productos.html">🍰 Listado Productos</a></li>
                <li><a href="admin_nuevo_producto.html">➕ Nuevo Producto</a></li>
                <li><a href="admin_usuarios.html">👥 Listado Usuarios</a></li>
                <li><a href="admin_nuevo_usuario.html">➕ Nuevo Usuario</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-content">
        <h1>Crear Nuevo Usuario</h1>
        <form id="form-nuevo-usuario">
            <label>RUN (Sin puntos ni guion):</label>
            <input type="text" id="run-user" minlength="7" maxlength="9" placeholder="Ej: 19011022K" required>

            <label>Nombre:</label>
            <input type="text" id="nombre-user" maxlength="50" required>

            <label>Apellidos:</label>
            <input type="text" id="apellidos-user" maxlength="100" required>

            <label>Correo:</label>
            <input type="email" id="correo-user" maxlength="100" required>

            <label>Fecha de Nacimiento (Opcional):</label>
            <input type="date" id="fecha-nac-user">

            <label>Tipo de Usuario:</label>
            <select id="rol-user" required>
                <option value="">Seleccione el rol...</option>
                <option value="Administrador">Administrador</option>
                <option value="Vendedor">Vendedor</option>
                <option value="Cliente">Cliente</option>
            </select>

            <label>Dirección:</label>
            <textarea id="direccion-user" maxlength="300" required></textarea>

            <button type="submit" style="margin-top: 15px;">Guardar Usuario</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
