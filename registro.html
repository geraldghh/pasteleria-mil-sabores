<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Pastelería Mil Sabores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor-formulario">
        <h2>Registro de usuario</h2>
        <form id="form-registro">
            <label for="nombre">NOMBRE COMPLETO</label>
            <input type="text" id="nombre" name="nombre" maxlength="100" required>

            <label for="correo">CORREO</label>
            <input type="email" id="correo" name="correo" maxlength="100" placeholder="Ej: usuario@duoc.cl" required>

            <label for="confirmar-correo">CONFIRMAR CORREO</label>
            <input type="email" id="confirmar-correo" name="confirmar-correo" maxlength="100" required>

            <label for="contrasena">CONTRASEÑA</label>
            <input type="password" id="contrasena" name="contrasena" minlength="4" maxlength="10" required>

            <label for="confirmar-contrasena">CONFIRMAR CONTRASEÑA</label>
            <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required>

            <label for="telefono">TELÉFONO (opcional)</label>
            <input type="tel" id="telefono" name="telefono">

            <div class="ubicacion">
                <select id="region" name="region" required>
                    <option value="">-- Seleccione la región --</option>
                    <option value="RM">Región Metropolitana de Santiago</option>
                </select>
                <select id="comuna" name="comuna" required>
                    <option value="">-- Seleccione la comuna --</option>
                </select>
            </div>

            <button type="submit">REGISTRAR</button>
        </form>
    </main>
</body>
</html>
