<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pastelería Mil Sabores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor-formulario login-box">
        <div class="texto-centrado" style="margin-bottom: 20px;">
            <a href="index.html"><img src="imagenes/logo.jpg" alt="Logo" width="90"></a>
            <h2>Pastelería Mil Sabores</h2>
        </div>
        <form id="form-login">
            <h3 class="titulo-caja">Inicio de sesión</h3>
            <label for="correo-login">CORREO</label>
            <input type="email" id="correo-login" name="correo-login" maxlength="100" required>

            <label for="contrasena-login">CONTRASEÑA</label>
            <input type="password" id="contrasena-login" name="contrasena-login" minlength="4" maxlength="10" required>

            <button type="submit">Iniciar sesión</button>
        </form>
        <p class="texto-centrado">¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
