<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Pastelería Mil Sabores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-principal">
        <div class="logo-container">
            <img src="imagenes/logo.jpg" alt="Logo Pastelería Mil Sabores" width="60">
            <span>Pastelería Mil Sabores</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="carrito-icono">
            <a href="carrito.html">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
        </div>
    </header>

    <main class="contenedor-carrito">
        <h1>Mi carrito de compras</h1>
        
        <section class="detalle-carrito">
    <div class="lista-items" id="items-carrito">
        <!-- El contenido ahora se genera dinámicamente desde script.js -->
    </div>

    <aside class="resumen-compra">
        <span id="resumen-descuento"></span>
        <h2>TOTAL: <span id="total-precio">$0</span></h2>
        <form id="form-cupon">
            <input type="text" id="cupon" placeholder="Ingrese el cupón de descuento">
            <button type="button" id="btn-aplicar-cupon">APLICAR</button>
        </form>
        <button id="btn-pagar" class="btn-pago-final">PAGAR</button>
    </aside>
</section>
    </main>

    <footer>
        <p>&copy; 2026 Pastelería Mil Sabores</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
