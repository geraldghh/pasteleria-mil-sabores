<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-layout">
    <aside class="sidebar">
        <div class="brand"><h2>¡HOLA Administrador!</h2></div>
        <nav class="menu-vertical">
            <ul>
                <li><a href="admin_home.html">🏠 Dashboard</a></li>
                <li><a href="admin_productos.html">🍰 Listado Productos</a></li>
                <li><a href="admin_nuevo_producto.html">➕ Nuevo Producto</a></li>
                <li><a href="admin_usuarios.html">👥 Listado Usuarios</a></li>
                <li><a href="admin_nuevo_usuario.html">➕ Nuevo Usuario</a></li>
                <li><a href="index.html">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-content">
      <h1>Nuevo Producto</h1>
      <form id="form-nuevo-producto">
      <label for="codigo-prod">Código producto:</label>
<input type="text" id="codigo-prod" name="codigo-prod" minlength="3" required>

<label for="nombre-prod">Nombre:</label>
<input type="text" id="nombre-prod" name="nombre-prod" maxlength="100" required>

<label for="desc-prod">Descripción (Opcional):</label>
<textarea id="desc-prod" name="desc-prod" maxlength="500"></textarea>

<label for="precio-prod">Precio:</label>
<input type="number" id="precio-prod" name="precio-prod" min="0" step="0.01" required>

<label for="stock-prod">Stock:</label>
<input type="number" id="stock-prod" name="stock-prod" min="0" required>

<label for="stock-critico">Stock Crítico (Alerta):</label>
<input type="number" id="stock-critico" name="stock-critico" min="0">

<label for="categoria-prod">Categoría:</label>
<select id="categoria-prod" name="categoria" required>
    <option value="">Seleccione...</option>
    <option value="cuadradas">Tortas Cuadradas</option>
    <option value="circulares">Tortas Circulares</option>
    <option value="individuales">Postres Individuales</option>
    <option value="sin_azucar">Productos Sin Azúcar</option>
    <option value="tradicional">Pastelería Tradicional</option>
    <option value="sin_gluten">Productos Sin Gluten</option>
    <option value="vegana">Productos Veganos</option>
    <option value="especiales">Tortas Especiales</option>
</select>

<label for="imagen-prod">Imagen (Opcional):</label>
<input type="file" id="imagen-prod" name="imagen-prod" accept="image/*">

<button type="submit" class="btn-formulario">Guardar Producto</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
